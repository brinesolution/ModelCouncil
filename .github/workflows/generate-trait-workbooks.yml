name: generate-trait-workbooks

on:
  push:
    branches:
      - phase-1-vertical-slice
    paths:
      - data/traits/catalog.source.json
      - scripts/generate_trait_workbooks.py
      - .github/workflows/generate-trait-workbooks.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-vertical-slice
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/generate_trait_workbooks.py
      - name: Commit generated workbooks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/traits/*.xlsx data/traits/catalog.manifest.json
          if git diff --cached --quiet; then
            echo 'Trait workbooks are already current.'
            exit 0
          fi
          git commit -m 'data: generate trait workbooks'
          git push origin HEAD:phase-1-vertical-slice
